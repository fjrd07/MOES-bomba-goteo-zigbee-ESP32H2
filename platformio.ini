[env:esp32-h2-devkitm-1]
; platform pineado a una version que incluye arduino-esp32 3.x, que integra el componente
; esp-zigbee-sdk/esp-zboss-lib usado directamente por src/zb_lib/zb_scheduler_lib.cpp (nuestra
; propia libreria Zigbee, ver ese archivo para el porque de no usar el wrapper Zigbee.h de
; alto nivel). Si al compilar no se encuentra "esp_zigbee_core.h", sube este numero de version.
platform = espressif32 @ ^6.9.0
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; El stack Zigbee necesita particiones NVS propias (zb_storage/zb_fct) que huge_app.csv no
; reserva. zigbee.csv viene incluido en el propio core arduino-esp32 (tools/partitions/) y
; sigue haciendo falta aunque zb_scheduler_lib no use el wrapper Zigbee.h.
board_build.partitions = zigbee.csv
extra_scripts = post:extra_script.py
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    tamctec/TAMC_GT911 @ ^1.0.2
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/RTClib @ ^2.1.4
    ; esp-zigbee-sdk (esp_zigbee_core.h, usado por src/zb_lib/zb_scheduler_lib.cpp) viene
    ; integrado en el core arduino-esp32 vía ZIGBEE_MODE_ED, no se declara aqui como lib_dep.
    ; RTC externo: DS3231 (I2C, ~USD 1, cristal compensado en temperatura ±2ppm), comparte el
    ; bus I2C que ya usa el táctil (SDA=GPIO8, SCL=GPIO9, dirección DS3231=0x68 vs GT911
    ; 0x5D/0x14 - sin colisión) - CERO pines GPIO nuevos. Se prefirió sobre usar los pines
    ; XTAL_32K nativos del ESP32-H2 (GPIO13/14) porque esos ya están asignados a
    ; LCD_MOSI/TOUCH_INT en este módulo de 15 GPIO totales, y liberar 2 pines para el cristal
    ; hubiera exigido sacrificar otra función (bateria ADC, sensado de corriente, etc.) sin
    ; necesidad. Ver docs/hardware/IRRIGATION_SCHEDULING.md sección RTC.

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=5

    ; Modo End Device (dispositivo final, no coordinador/router) - obligatorio para que se
    ; compile el componente esp-zigbee-sdk/esp-zboss-lib que usa zb_scheduler_lib.cpp.
    -D ZIGBEE_MODE_ED=1

    ; Configuración TFT_eSPI para ESP32-H2 (Generica ST7796 320x480)
    ; NOTA: TFT_eSPI solo lee estos pines en tiempo de compilacion via build_flags -
    ; no se pueden mover desde src/Config.h. Si cambias un pin fisico de la pantalla,
    ; actualiza el valor aqui (ver tambien los alias PIN_LCD_* documentados en Config.h).
    ; El esquematico oficial del modulo (docs/hardware/esp32h2_supermini_header_pinout.png)
    ; solo expone 15 GPIO utilizables en total (0-5, 8-14, mas U0RXD/U0TXD = GPIO23/24) - no
    ; hay un tercer pin libre para CS+DC+Touch_RST simultaneamente. Resolucion: TFT_CS se ata
    ; permanentemente a GND (unico dispositivo en el bus SPI, no necesita seleccion activa;
    ; TFT_eSPI soporta TFT_CS=-1 para este caso), liberando GPIO23 para PIN_TOUCH_RST.
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1 ; Driver común para IPS 3.5/4.0
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_CS=-1   ; Atado permanentemente a GND en la placa (unico dispositivo SPI, sin necesidad de CS activo)
    -D TFT_DC=24   ; GPIO24 ("TX"/U0TXD en el módulo Supermini) - Data/Command del panel TFT
    -D TFT_RST=5   ; GPIO5  - Reset del panel TFT
    -D TFT_MOSI=13 ; GPIO13 - Master Out, datos SPI hacia el panel
    -D TFT_SCLK=12 ; GPIO12 - Reloj SPI del panel
    -D TFT_MISO=-1 ; Opcional si solo envio datos
    -D TFT_BL=4    ; GPIO4  - Backlight (brillo, PWM opcional)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000 ; 40MHz
